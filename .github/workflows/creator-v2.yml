name: Creator and game regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/project-campaign.cjs
      - run: node tests/dialogue-contract.cjs
      - run: node tests/responsibilities.cjs
      - run: node tests/collection-contract.spec.cjs
      - run: node tests/ending-review.cjs
      - run: node tests/collection-paths.cjs
      - run: node tests/smoke.cjs
      - run: node --test tests/ending-priority.spec.js tests/ending-witness.spec.js tests/terminal-ending-witness.spec.js tests/all-ending-witness.spec.js tests/release-placeholders.spec.js
      - run: node tests/campaign-browser.cjs
      - run: node tests/creator-v2.cjs
      - run: node tests/office-ui.cjs
      - run: node tests/dialogue-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-screenshots
          path: tests/*.png
